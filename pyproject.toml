[project]
name = "forja-infra"
version = "0.1.1"
description = "Plugin de forja — infraestructura como código con Ansible"
requires-python = ">=3.10"
authors = [{ name = "Juan David Lopez Leon" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "forja>=1.0.1",
]

[project.optional-dependencies]
ansible = [
    "ansible>=9.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.entry-points."forja.plugins"]
infra = "forja_infra.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_infra"]

[tool.ruff]
target-version = "py311"
line-length = 100
